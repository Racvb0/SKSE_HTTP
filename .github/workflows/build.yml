name: Build SKSE_HTTP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # windows-latest trae MSVC 14.51 (19.51.x): el mismo juego de herramientas con
    # que se construyó CommunityShaders y el bundle precompilado del SDK. Mezclar
    # 14.44/14.51 en un mismo proceso es un escenario de corrupción de memoria
    # (advertencia del propio Prebuilt.cmake del SDK) y sospechoso del crash al
    # arranque con CommunityShaders (crash-2026-10-23-21-53-54).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar Ninja
        run: choco install ninja -y

      - name: Caché binaria de vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configurar
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Forzar SDK por fuente: el bundle precompilado se enlazó contra otra
          # versión de fmt (su símbolo detail::allocate ya no existe en fmt.lib →
          # LNK2001). Sin GITHUB_ACTIONS en el entorno, Prebuilt.cmake cae a fuente.
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          Write-Host "Usando vcpkg en: $vcpkg"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DBUILD_TESTS=OFF

      - name: Compilar
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: cmake --build build --parallel

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SKSE_HTTP
          path: build/SKSE_HTTP.dll
          if-no-files-found: error
